name: Android-App bauen
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android-SDK vorbereiten
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" || $SDKM "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - name: Android-Projekt erzeugen
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets
          npx cap add android
          node scripts/patch-android.mjs
      - name: Symbole erzeugen (nicht kritisch)
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk weber-zeit.apk
      - uses: actions/upload-artifact@v4
        with: { name: weber-zeit-apk, path: weber-zeit.apk }
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('app-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Android-App Build {0}', github.run_number) }}
          files: weber-zeit.apk
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: false
          body: |
            Android-App (Debug-Signatur) für das Geschäftstablet und das Handy der Mitarbeiterin.
            Installieren: Datei öffnen, „Installation aus dieser Quelle“ erlauben. Updates brauchen vorher eine Deinstallation.
