name: Android-App bauen
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - name: Android-Projekt erzeugen
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          node scripts/patch-android.mjs
      - name: Symbole erzeugen (nicht kritisch)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk weber-zeit.apk
      - uses: actions/upload-artifact@v4
        with: { name: weber-zeit-apk, path: weber-zeit.apk }
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: weber-zeit.apk }
